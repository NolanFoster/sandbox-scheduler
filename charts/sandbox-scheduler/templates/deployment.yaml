{{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection) }}
{{- fail "replicaCount > 1 requires leaderElection=true: placement reservations are only exact while one replica makes every decision" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "sandbox-scheduler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sandbox-scheduler.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sandbox-scheduler.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.scheduler.enableClaims }}
      terminationGracePeriodSeconds: {{ include "sandbox-scheduler.terminationGracePeriodSeconds" . }}
      {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --secret-namespace={{ .Release.Namespace }}
            - --refresh-interval={{ .Values.scheduler.refreshInterval | default "10s" }}
            - --stale-after={{ .Values.scheduler.staleAfter | default "30s" }}
            - --reservation-grace={{ .Values.scheduler.reservationGrace | default "5s" }}
            - --cold-start-window={{ .Values.scheduler.coldStartWindow | default "30s" }}
            - --scheduler-bind-address=:{{ .Values.service.port | default 8082 }}
            - --metrics-bind-address=:{{ .Values.metrics.port | default 8080 }}
            - --health-probe-bind-address=:8081
            - --leader-elect={{ .Values.leaderElection | default false }}
            - --enable-claims={{ .Values.scheduler.enableClaims | default false }}
            - --claim-timeout={{ .Values.scheduler.claimTimeout | default "15s" }}
            - --claim-max-inflight={{ .Values.scheduler.claimMaxInFlight | default 4096 }}
            - --claim-queue-timeout={{ .Values.scheduler.claimQueueTimeout | default "1s" }}
            - --claim-max-ttl={{ .Values.scheduler.claimMaxTTL | default "24h" }}
            - --max-spill={{ .Values.scheduler.maxSpill | default 3 }}
            - --max-joiners-per-key={{ .Values.scheduler.maxJoinersPerKey | default 8 }}
            - --refusal-ttl={{ .Values.scheduler.refusalTTL | default "1s" }}
            - --reap-interval={{ .Values.scheduler.reapInterval | default "30s" }}
            - --reap-max-per-cycle={{ .Values.scheduler.reapMaxPerCycle | default 200 }}
            - --reap-rate={{ .Values.scheduler.reapRate | default 10 }}
            - --reap-dry-run={{ .Values.scheduler.reapDryRun | default false }}
            - --release-name={{ include "sandbox-scheduler.fullname" . }}
            {{- if .Values.scheduler.clusterId }}
            - --cluster-id={{ .Values.scheduler.clusterId }}
            {{- end }}
          env:
            # The scheduler defaults --secret-namespace from this, so the flag
            # above and this stay consistent even if one is overridden.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The leader labels its own pod by name for the placement Service.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if or .Values.placementApi.token .Values.placementApi.existingSecret }}
            - name: PLACEMENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.placementApi.existingSecret | default (printf "%s-api-token" (include "sandbox-scheduler.fullname" .)) }}
                  key: {{ .Values.placementApi.existingSecretKey }}
            {{- end }}
            {{- if or .Values.placementApi.claimToken .Values.placementApi.claimExistingSecret }}
            - name: PLACEMENT_CLAIM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.placementApi.claimExistingSecret | default (printf "%s-api-token" (include "sandbox-scheduler.fullname" .)) }}
                  key: {{ .Values.placementApi.claimExistingSecretKey }}
            {{- end }}
          ports:
            - name: placement
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: probes
              containerPort: 8081
          # Probes hit the manager's own endpoints, not the placement API: the
          # placement API answering is not evidence that the controllers are
          # healthy, and restarting on a placement error would be the wrong
          # response anyway.
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
