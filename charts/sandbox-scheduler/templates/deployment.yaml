apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "sandbox-scheduler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sandbox-scheduler.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sandbox-scheduler.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --secret-namespace={{ .Release.Namespace }}
            - --refresh-interval={{ .Values.scheduler.refreshInterval }}
            - --stale-after={{ .Values.scheduler.staleAfter }}
            - --scheduler-bind-address=:{{ .Values.service.port }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:8081
            - --leader-elect={{ .Values.leaderElection }}
          env:
            # The scheduler defaults --secret-namespace from this, so the flag
            # above and this stay consistent even if one is overridden.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: placement
              containerPort: {{ .Values.service.port }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: probes
              containerPort: 8081
          # Probes hit the manager's own endpoints, not the placement API: the
          # placement API answering is not evidence that the controllers are
          # healthy, and restarting on a placement error would be the wrong
          # response anyway.
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
