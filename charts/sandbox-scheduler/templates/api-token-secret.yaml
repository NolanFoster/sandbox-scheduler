{{- if and .Values.placementApi.token (not .Values.placementApi.existingSecret) }}
{{- /*
  Only rendered for an inline token, and only when no existing Secret was
  named. An inline value ends up in the Helm release history in plain text, so
  existingSecret is the right answer for anything long-lived — this path exists
  for quick evaluation, not for production.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}-api-token
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.placementApi.existingSecretKey }}: {{ .Values.placementApi.token | quote }}
{{- end }}
