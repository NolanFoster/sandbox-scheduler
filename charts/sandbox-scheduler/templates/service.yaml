# Placement goes to the leader alone. Standbys are Ready but unlabeled, so they
# stay out of this Service's endpoints without blocking rollouts.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sandbox-scheduler.selectorLabels" . | nindent 4 }}
    {{- if .Values.leaderElection }}
    placement.agents.x-k8s.io/active: "true"
    {{- end }}
  ports:
    - name: placement
      port: {{ .Values.service.port }}
      targetPort: placement
{{- if .Values.metrics.enabled }}
---
# Every replica, leader or not, so standbys are scraped too.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sandbox-scheduler.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector: {{- include "sandbox-scheduler.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
