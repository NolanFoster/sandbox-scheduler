# Generated from kubebuilder markers; keep in step with config/rbac/role.yaml.
#
# SandboxProvider and SandboxPlacementPolicy are cluster-scoped, so watching
# them requires a ClusterRole. Provider credential Secrets are read exclusively
# from the scheduler's own namespace (--secret-namespace) and are granted by
# the unconditional namespaced Role below rather than cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resourceNames: [kube-system]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [placement.agents.x-k8s.io]
    resources: [sandboxplacementpolicies, sandboxproviders]
    verbs: [get, list, watch]
  - apiGroups: [placement.agents.x-k8s.io]
    resources: [sandboxplacementpolicies/status, sandboxproviders/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sandbox-scheduler.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sandbox-scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Unconditional namespaced Role granting read access to provider credential
# Secrets in the scheduler's own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sandbox-scheduler.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "sandbox-scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection }}
---
# Leader election, and the leader labeling its own pod so the placement Service
# routes to it. Namespaced, because the lease and the pods live beside the
# deployment rather than cluster-wide. The pod grant cannot name the pod, which
# a Deployment does not know in advance, so it covers the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sandbox-scheduler.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandbox-scheduler.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sandbox-scheduler.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "sandbox-scheduler.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
