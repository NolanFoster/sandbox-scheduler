---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: sandboxplacementpolicies.placement.agents.x-k8s.io
spec:
  group: placement.agents.x-k8s.io
  names:
    kind: SandboxPlacementPolicy
    listKind: SandboxPlacementPolicyList
    plural: sandboxplacementpolicies
    shortNames:
    - spp
    singular: sandboxplacementpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SandboxPlacementPolicy declares how sandboxes are placed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SandboxPlacementPolicySpec is a named scheduling profile.
            properties:
              filters:
                description: |-
                  Filters are hard constraints, by name: RequiredAttributes, Reachable.

                  Note that omitting Reachable is a legitimate and often correct choice:
                  a provider can miss heartbeats while still accepting claims, and
                  excluding it makes placement fail for want of a heartbeat. Leaving it out
                  and relying on the Reachability scorer demotes instead.
                items:
                  type: string
                type: array
              priority:
                default: 0
                description: |-
                  Priority breaks ties when several policies match the same sandbox;
                  highest wins. Without it, "which policy applied?" would depend on
                  resource ordering, and the answer would change as objects are created
                  and deleted.
                format: int32
                type: integer
              requires:
                additionalProperties:
                  type: string
                description: |-
                  Requires are attribute requirements applied to every sandbox this policy
                  governs, e.g. {"runtime": "gvisor"} to keep a namespace's workloads on
                  kernel-isolated providers. Enforced by the RequiredAttributes filter, so
                  setting this without that filter has no effect — the controller reports
                  that as a condition rather than silently ignoring it.
                type: object
              scorers:
                description: Scorers are weighted preferences applied to whatever
                  survives filtering.
                items:
                  description: ScorerConfig enables a scorer and sets how much it
                    counts.
                  properties:
                    name:
                      description: 'Name of a registered scorer: WarmCapacity, Cost,
                        Reachability, Affinity.'
                      minLength: 1
                      type: string
                    weight:
                      default: 1
                      description: |-
                        Weight multiplies this scorer's normalized 0..100 output.

                        Weights are the whole tuning surface. A scorer cannot increase its own
                        influence by returning bigger numbers — the framework clamps to 100 — so
                        relative importance is decided here and only here.
                      format: int64
                      minimum: 0
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              selector:
                description: |-
                  Selector chooses which sandboxes this policy governs. An empty selector
                  matches everything, which is what makes a single cluster-wide default
                  policy expressible.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            type: object
          status:
            description: SandboxPlacementPolicyStatus reports whether a policy is
              usable.
            properties:
              conditions:
                description: |-
                  Conditions follow the standard convention. "Valid" is false when the
                  policy names a filter or scorer this scheduler does not implement.

                  Invalid policies are rejected rather than partially applied: silently
                  dropping an unknown filter would place workloads under weaker
                  constraints than the operator wrote down, which is the worst possible
                  failure for a policy engine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
