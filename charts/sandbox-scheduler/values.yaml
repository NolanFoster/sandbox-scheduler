# Default values for sandbox-scheduler.

image:
  repository: ghcr.io/nolanfoster/sandbox-scheduler
  # Defaults to the chart's appVersion. Prefer an immutable reference — a
  # sha-<commit> tag or a digest — over a moving one like `main`.
  tag: ""
  # Always, not IfNotPresent. With a moving tag the node reuses whatever layer
  # it already cached and silently runs an old binary: that is how a build with
  # authentication in it was deployed, reported healthy, and served
  # unauthenticated requests. Pin an immutable tag and this costs a registry
  # HEAD per start; leave the tag moving and it is the only thing making a
  # rollout mean anything.
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# One leader serves placement; the other replicas are warm standbys. Placement
# reserves warm capacity in the deciding replica's memory, which is only exact
# while one replica makes every decision, so extra replicas add availability,
# not throughput. One replica decides in microseconds, far faster than any
# cluster can claim sandboxes.
replicaCount: 2

# Required with more than one replica, and the chart refuses to render without
# it. The leader labels its own pod placement.agents.x-k8s.io/active=true and
# the placement Service selects on that label. Standbys stay Ready, keep their
# registry current, and take over when the leader goes. A graceful shutdown
# hands over within seconds; a crash waits out the 15s lease.
leaderElection: true

scheduler:
  # How often provider capacity is polled. Off the placement path entirely, so
  # this trades freshness against load on providers, never placement latency.
  refreshInterval: 10s
  # How long a capacity report stays trusted. Past this the provider is treated
  # as unreachable, but keeps its last known capacity so policy can still
  # choose to use it rather than fail.
  staleAfter: 30s
  # How long a claim may take to show up in a provider's capacity report.
  # Placements are subtracted from a provider's warm capacity until a poll
  # started this long after them succeeds, so a burst spreads across providers
  # instead of piling onto the one that looked best at the last poll. Only the
  # leader places, so its count covers every placement.
  reservationGrace: 5s
  # How long a cold placement counts as in flight, roughly how long a cold
  # start takes. When providers with no warm capacity tie, the next cold start
  # goes to the one with fewer in flight rather than the first by name.
  coldStartWindow: 30s

service:
  type: ClusterIP
  port: 8082

# Bearer token for the placement API. Leave empty only while the API is
# reachable solely from inside the cluster: GET /providers discloses provider
# endpoints and live capacity, which is reconnaissance for anyone choosing a
# target. Anything fronting this with an ingress or tunnel must set it.
#
# existingSecret takes precedence; the chart never writes a token it was given
# inline into a Secret it manages, because that value would then live in the
# Helm release history in plain text.
placementApi:
  token: ""
  existingSecret: ""
  existingSecretKey: token

metrics:
  enabled: true
  port: 8080
  # Requires the Prometheus Operator's ServiceMonitor CRD, so it stays off by
  # default — enabling it on a cluster without that CRD fails the install.
  #
  # Turn it on before running a soak. The placement metrics answer questions
  # that cannot be reconstructed afterwards: spill rate is
  #   1 - rate(sandbox_scheduler_placements_total{cheapest="true"}[1h])
  #     / rate(sandbox_scheduler_placements_total[1h])
  # and nothing else records what the alternatives cost at decision time.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# The scheduler holds credentials for every provider in the fleet, so it runs
# with everything dropped by default.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Install the CRDs with the chart. Set false when they are managed separately —
# Helm does not upgrade CRDs installed this way, so a cluster with several
# releases should manage them out of band.
installCRDs: true
