---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-scheduler
rules:
- apiGroups:
  - ""
  resourceNames:
  - kube-system
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - placement.agents.x-k8s.io
  resources:
  - sandboxplacementpolicies
  - sandboxproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - placement.agents.x-k8s.io
  resources:
  - sandboxplacementpolicies/status
  - sandboxproviders/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-scheduler
  namespace: sandbox-scheduler
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
